services:
  - type: web
    name: privaledger-ai
    env: static
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: microphone=(self)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
